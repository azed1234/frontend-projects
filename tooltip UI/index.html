<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Tooltio UI</title>
</head>

<body>

  <header class="navbar">

    <div class="logo">DevFolder</div>

    <nav class="nav-links">
      <div class="nav-item">
        <a href="#home">Home</a>
        <span class="tooltip" role="tooltip">Back to overview</span>
      </div>

      <span class="dot">•</span>

      <div class="nav-item">
        <a href="#projects">Projects</a>
        <span class="tooltip" role="tooltip">Here is everything I have built</span>
      </div>

      <span class="dot">•</span>

      <div class="nav-item">
        <a href="#blog">Blog</a>
        <span class="tooltip" role="tooltip">Read my latest articles</span>
      </div>
    </nav>
  </header>

  <main>
    <h1>Building Accessible Web Interfaces</h1>
    <p>Hover over the navigation items in the top bar to preview the tooltips built with pure CSS.</p>
  </main>

</body>

</html>
