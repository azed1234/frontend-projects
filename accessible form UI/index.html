<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Form UI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="form-card">

    <section class="form-section">
      <form novalidate>

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="What should we call you?">
        </div>

        <div class="form-group error-state">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="Cristian@gmail.com" aria-required="true"
            aria-invalid="true" aria-describedby="email-error">
          <span id="email-error" class="error-message" role="alert">Email is already taken</span>
        </div>

        <div class="form-group">
          <label for="password">Enter Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="password" name="password" placeholder="XXXXXXXX" aria-required="true">
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              👁
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password"> Confirm Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="XXXXXXXX"
              aria-required="true">
            <button type="button" class="password-toggle" aria-label="Toggle confirm password visibility">
              👁
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Update Profile</button>

      </form>
    </section>

    <aside class="progress-section">
      <div class="progress-ring" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100"
        aria-label="Profile Completeness">
        <span class="progress-value">65%</span>
      </div>
      <h2 class="progress-title">Profile Completeness</h2>
      <div class="checklist-box">
        <ul class="checklist">
          <li class="completed"><del>Create Account</del></li>
          <li class="completed"><del>Update Roadmap Progress</del></li>
          <li class="completed"><del>Setup Public Profile</del></li>
          <li>Complete your first project</li>
          <li>Invite your Friends</li>
        </ul>
      </div>
    </aside>

  </main>

</body>

</html>
