      <h1>Contacts</h1>
      <p>Feel free to reach out using the form below or via my direct email.</p>

      <form action="submit_form.php" method="POST">
        <div>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" placeholder="Juan Dela Cruz" required>
        </div>

        <br>

        <div>
          <label for="email">Email:</label><br>
          <input type="text" id="email" name="email" placeholder="Juandelacruz@gmail.com" required>

        <br>

        <div>
          <label for="subject">Subject:</label><br>
          <input type="subject" id="subject" name="subject" placeholder="Project Inquiry" required>
        </div>

        <br>

        <div>
          <label for="message">Message:</label><br>
          <textarea type="message" id="message" name="message" rows="5" cols="30"
            placeholder="Type your message here..." required></textarea>
        </div>

        <br>

        <button type="submit">Send Message</button>
