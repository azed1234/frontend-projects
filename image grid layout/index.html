<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <div class="image-grid">

      <div class="image-one">
        <img src="images/jasper-gribble-TTExgxV06KA-unsplash.jpg" alt="image of a foggy beach">
      </div>

      <div class="image-two">
        <img src="images/Screenshot 2026-09-03 172540.png" alt="A table topped with plates and bowls of food">
      </div>

      <div class="image-three">
        <img src="images/florian-schmid-f1PzRPbqt0M-unsplash.jpg"
          alt="A row of white apartment buildings next to a street">
      </div>

      <div class="image-four">
        <img src="images/pawel-czerwinski-Wuu6H3mI7UA-unsplash.jpg"
          alt="A living room with a white couch and a round window">
      </div>

      <div class="image-five">
        <img src="images/bernhard-uTd-kylh7bE-unsplash.jpg" alt="A building with a red door and a tree in front of it">
      </div>

      <div class="image-six">
        <img src="images/Screenshot 2026-09-03 172611.png" alt="A view of a beach from the top of a hill">
      </div>

    </div>
  </main>
</body>

</html>
